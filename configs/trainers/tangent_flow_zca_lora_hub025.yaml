METHOD: "tangent_flow"
SEED: 1

DEVICE:
  DEVICE_NAME: "cuda"
  GPU_ID: "0;"

DATALOADER:
  TRAIN:
    BATCH_SIZE_BASE: 64
    BATCH_SIZE_INC: 64
  TEST:
    BATCH_SIZE: 100
  NUM_WORKERS: 4


MODEL:
  BACKBONE:
    NAME: "ViT-B/16"  #  RN50  RN101  ViT-B/32  ViT-B/16  ViT-L/14


TRAINER:
  BiMC:
    PREC: "fp32"  # required by the Base Vision LoRA trainer

    VISION_CALIBRATION: True
    LAMBDA_I: 0.1
    TAU: 16

    TEXT_CALIBRATION: True
    LAMBDA_T: 0.5


# Distributional text-to-visual Flow with exemplar-free incremental replay.
FLOW:
  STEPS_PER_EPOCH: 100
  COV_SHRINK: 0.1  # distribution replay covariance; ZCA shrink is computed from sample count
  COV_TRANSFER_TEMPERATURE: 16.0
  REPLAY_FRACTION: 0.5
  BANK_MODE: "calibrated_flow20"
  INC_FLOW_WEIGHT: 0.5  # new classes: calibrated visual and generated Flow equally
  FUNNEL_MODE: True
  SCORE_MODE: "cosine_sum"  # raw visual and reverse-text cosine scores; no Cov/KNN probabilities
  TEXT_SCORE_WEIGHT: 1.2
  HUB_WEIGHT: 0.25
  TTA: True  # 5 views and their horizontal flips
  TTA_PROTOTYPES: True  # same ten-view feature average for Base and support prototypes
  DIAGONAL_WHITEN: True  # enables regularized Base within-class ZCA matrix
  VIS_WHITEN_POWER: 0.75
  TEXT_WHITEN_MODE: "none"
  NOISE_SCALE: 0.25
  EPOCHS: 100
  BATCH_SIZE: 64
  LR: 0.0002
  WEIGHT_DECAY: 0.0001
  WARMUP_RATIO: 0.05
  MIN_LR_RATIO: 0.01
  BLOCKS: 8
  STEPS: 8
  SOLVER: "euler"  # euler, midpoint, heun, rk4; inference only
  OUTPUT_DIR: "output/dual_funnel_zca075_lora_rank4_hub025"
  ADAPT_STEPS: 100  # incremental FM plus previous-session velocity distillation
  DISTILL_WEIGHT: 1.0
  REPLAY_STRATEGY: "base_incremental_half"

LORA:
  ENABLED: True
  RANK: 4
  ALPHA: 2.0
  LAST_BLOCKS: 4
  EPOCHS: 5
  LR: 0.0002
  WEIGHT_DECAY: 0.0001
  ANCHOR_WEIGHT: 0.1
