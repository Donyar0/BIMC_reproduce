METHOD: "visual_to_text"
SEED: 1

DEVICE:
  DEVICE_NAME: "cuda"
  GPU_ID: "0;"

DATALOADER:
  TRAIN:
    BATCH_SIZE_BASE: 64
    BATCH_SIZE_INC: 64
  TEST:
    BATCH_SIZE: 100
  NUM_WORKERS: 4


MODEL:
  BACKBONE:
    NAME: "ViT-B/16"  #  RN50  RN101  ViT-B/32  ViT-B/16  ViT-L/14
  

TRAINER:
  BiMC:
    PREC: "fp16"  # fp16, fp32, amp

    PROTOTYPE_CACHE_DIR: ""  # e.g. output/bimc_prototypes; export training/support statistics

    VISION_CALIBRATION: False
    LAMBDA_I: 0.1 
    TAU: 16        

    TEXT_CALIBRATION: True
    LAMBDA_T: 0.5

    GAMMA_BASE: 1.0
    GAMMA_INC: 5.0

    USING_ENSEMBLE: False


# Starting values only; select hyperparameters using base validation data.
FLOW:
  EPOCHS: 100
  BATCH_SIZE: 64
  LR: 0.0002
  WEIGHT_DECAY: 0.0001
  BLOCKS: 24
  HIDDEN: 0  # 0 uses CLIP feature dimension
  SOURCE: "sample"  # sample images -> correct class text; optional prototype
  CE_WEIGHT: 0.1  # 0 disables endpoint text CE
  TEMPERATURE: 0.07
  STEPS: 1  # Euler steps; 1 means z + v(z, 0)
  ALPHAS: [0.0, 0.1, 0.2, 0.5, 1.0]  # normalize((1-alpha)*CLIP + alpha*Flow)
  CHECKPOINT: ""  # set path or --flow_checkpoint to reuse weights; empty trains once
  TRUST_CHECKPOINT: False  # only for your own trusted checkpoint on older PyTorch
  OUTPUT_DIR: "output/visual_to_text"



  # Incremental stages only: new 5-shot support; CE over all seen classes.
  INC:
    ENABLED: True
    EPOCHS: 10
    BATCH_SIZE: 25
    LR: 0.00001
    WEIGHT_DECAY: 0.0
    CE_WEIGHT: 0.1
    TEMPERATURE: 0.07
