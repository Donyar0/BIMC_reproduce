METHOD: "visual_to_text"
SEED: 1

DEVICE:
  DEVICE_NAME: "cuda"
  GPU_ID: "0;"

DATALOADER:
  TRAIN:
    BATCH_SIZE_BASE: 64
    BATCH_SIZE_INC: 64
  TEST:
    BATCH_SIZE: 100
  NUM_WORKERS: 4


MODEL:
  BACKBONE:
    NAME: "ViT-B/16"  #  RN50  RN101  ViT-B/32  ViT-B/16  ViT-L/14
  

TRAINER:
  BiMC:
    PREC: "fp16"  # fp16, fp32, amp

    PROTOTYPE_CACHE_DIR: ""  # e.g. output/bimc_prototypes; export training/support statistics

    VISION_CALIBRATION: False
    LAMBDA_I: 0.1 
    TAU: 16        

    TEXT_CALIBRATION: True
    LAMBDA_T: 0.5

    GAMMA_BASE: 1.0
    GAMMA_INC: 5.0

    USING_ENSEMBLE: False


# Starting values only; select hyperparameters using base validation data.
FLOW:
  EPOCHS: 100
  BATCH_SIZE: 64
  LR: 0.0002
  WEIGHT_DECAY: 0.0001
  BLOCKS: 24
  HIDDEN: 0  # 0 uses CLIP feature dimension
  SOURCE: "sample"  # sample images -> correct class text; optional prototype
  CE_WEIGHT: 0.0  # no CE loss
  TEMPERATURE: 0.07
  STEPS: 1  # Euler steps; 1 means z + v(z, 0)
  ALPHAS: [1.0]  # full Flow endpoint; no residual mixture
  CHECKPOINT: ""  # set path or --flow_checkpoint to reuse weights; empty trains once
  TRUST_CHECKPOINT: False  # only for your own trusted checkpoint on older PyTorch
  OUTPUT_DIR: "output/visual_to_text"



  # Episodic pseudo-incremental meta-learning from real base training features.
  # On: base training uses disjoint 5-shot support and query episodes;
  # off: original base fit() is unchanged. Never use --flow_checkpoint
  # with META.ENABLED=true (the checkpoint would skip meta training).
  META:
    ENABLED: True
    EPOCHS: 20
    EPISODES_PER_EPOCH: 30
    PSEUDO_NEW: 10
    SHOT: 5
    QUERY: 5
    BASE_BATCH: 64
    OLD_QUERY_BATCH: 64
    INNER_STEPS: 1
    INNER_LR: 0.0001
    LR: 0.0001
    BASE_FM_WEIGHT: 1.0
    OLD_FM_WEIGHT: 0.5
    NOVEL_FM_WEIGHT: 1.0

  # Incremental stages only: FM on current new 5-shot support.
  INC:
    ENABLED: True
    EPOCHS: 10
    BATCH_SIZE: 25
    LR: 0.00001
    WEIGHT_DECAY: 0.0
    CE_WEIGHT: 0.0
    TEMPERATURE: 0.07
