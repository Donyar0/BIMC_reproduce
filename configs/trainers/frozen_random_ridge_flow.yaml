METHOD: "frozen_ridge_flow"
SEED: 1

DEVICE:
  DEVICE_NAME: "cuda"
  GPU_ID: "0;"

DATALOADER:
  TRAIN:
    BATCH_SIZE_BASE: 64
    BATCH_SIZE_INC: 64
  TEST:
    BATCH_SIZE: 100
  NUM_WORKERS: 4

MODEL:
  BACKBONE:
    NAME: "ViT-B/16"

TRAINER:
  BiMC:
    PREC: "fp32"
    VISION_CALIBRATION: False
    TEXT_CALIBRATION: True
    LAMBDA_T: 0.5

FLOW:
  STEPS_PER_EPOCH: 100
  COV_SHRINK: 0.1
  BANK_MODE: "calibrated_flow20"
  FUNNEL_MODE: True
  SCORE_MODE: "cosine_sum"
  TTA: False
  TTA_PROTOTYPES: False
  DIAGONAL_WHITEN: False
  NOISE_SCALE: 0.25
  EPOCHS: 100
  BATCH_SIZE: 64
  LR: 0.0002
  WEIGHT_DECAY: 0.0001
  WARMUP_RATIO: 0.05
  MIN_LR_RATIO: 0.01
  BLOCKS: 8
  STEPS: 8
  SOLVER: "euler"
  ADAPT_STEPS: 0
  OUTPUT_DIR: "output/frozen_random_ridge_flow8192"

LORA:
  ENABLED: False

RIDGE:
  FEATURE_DIM: 8192
  LAMBDA: 1.0
  BATCH_SIZE: 256
  BLEND_WEIGHT: 0.5
