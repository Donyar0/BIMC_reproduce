METHOD: "tangent_flow"
SEED: 1

DEVICE:
  DEVICE_NAME: "cuda"
  GPU_ID: "0;"

DATALOADER:
  TRAIN:
    BATCH_SIZE_BASE: 64
    BATCH_SIZE_INC: 64
  TEST:
    BATCH_SIZE: 100
  NUM_WORKERS: 4


MODEL:
  BACKBONE:
    NAME: "ViT-B/16"  #  RN50  RN101  ViT-B/32  ViT-B/16  ViT-L/14


TRAINER:
  BiMC:
    PREC: "fp32"

    PROTOTYPE_CACHE_DIR: ""  # e.g. output/bimc_prototypes; export training/support statistics

    VISION_CALIBRATION: True
    LAMBDA_I: 0.1
    TAU: 16

    TEXT_CALIBRATION: True
    LAMBDA_T: 0.5


# Distributional text-to-visual Flow with exemplar-free incremental replay.
FLOW:
  STEPS_PER_EPOCH: 100
  VISUAL_SCALE: 1.0
  MAX_RADIUS: 0.5
  COV_SHRINK: 0.1
  COV_TRANSFER_TEMPERATURE: 16.0
  REPLAY_FRACTION: 0.5
  CYCLE_SCALE: 0.01
  CYCLE_GATE: False  # diagnostic baseline: disable reconstruction gate
  COSINE_TEMPERATURE: 500.0  # visual Bank and reverse-text Flow only
  KNN_TEMPERATURE: 500.0  # match Flow cosine probability sharpness
  COV_DIVISOR: 2048.0  # weaker Mahalanobis prior than original /512
  USE_GEOMETRY_PRIORS: False
  CONTRAST_WEIGHT: 0.0  # isolate distillation plus full KNN
  BANK_MODE: "calibrated_flow20"
  FUNNEL_MODE: True
  SCORE_MODE: "cosine_sum"
  TTA: True  # 5 views and their horizontal flips
  TTA_PROTOTYPES: True  # same ten-view feature average for Base and support prototypes
  DIAGONAL_WHITEN: True  # Base within-class standard deviation
  VIS_WHITEN_POWER: 0.75
  TEXT_WHITEN_MODE: "none"
  SUPPORT_MARGIN: False  # isolate centering and branch calibration
  QUERY_TEXT_LAMBDA: 0.15
  QUERY_TEXT_MODE: "residual"
  VIS_CENTERING: False
  BRANCH_ZSCORE: True
  QUERY_TEXT_TAU: 3.0
  CONTRAST_TEMPERATURE: 20.0
  NOISE_SCALE: 0.25
  EPOCHS: 100
  BATCH_SIZE: 64
  LR: 0.0002
  WEIGHT_DECAY: 0.0001
  WARMUP_RATIO: 0.05
  MIN_LR_RATIO: 0.01
  BLOCKS: 8
  HIDDEN: 0  # 0 uses CLIP feature dimension
  STEPS: 8
  SOLVER: "midpoint"  # euler, midpoint, heun, rk4; inference only
  OUTPUT_DIR: "output/no_center_zscore_midpoint_residual_lora_cub200"
  ADAPT_STEPS: 100  # incremental FM plus previous-session velocity distillation
  DISTILL_WEIGHT: 1.0
  REPLAY_STRATEGY: "base_incremental_half"
  ALPHA: 1.0  # full reverse image-to-text integration
  BETA_BASE: 0.1
  BETA_INC: 0.5  # validation search: 0.3 to 0.6
  GAMMA: 0.5
  GAMMA_BASE: 0.5
  GAMMA_INC: 0.5

LORA:
  ENABLED: True
  RANK: 2
  ALPHA: 2.0
  LAST_BLOCKS: 4
  EPOCHS: 5
  LR: 0.0002
  WEIGHT_DECAY: 0.0001
  ANCHOR_WEIGHT: 0.1
