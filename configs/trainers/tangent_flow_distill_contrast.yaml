METHOD: "tangent_flow"
SEED: 1

DEVICE:
  DEVICE_NAME: "cuda"
  GPU_ID: "0;"

DATALOADER:
  TRAIN:
    BATCH_SIZE_BASE: 64
    BATCH_SIZE_INC: 64
  TEST:
    BATCH_SIZE: 100
  NUM_WORKERS: 4


MODEL:
  BACKBONE:
    NAME: "ViT-B/16"  #  RN50  RN101  ViT-B/32  ViT-B/16  ViT-L/14


TRAINER:
  BiMC:
    PREC: "fp16"  # fp16, fp32, amp

    PROTOTYPE_CACHE_DIR: ""  # e.g. output/bimc_prototypes; export training/support statistics

    VISION_CALIBRATION: False
    LAMBDA_I: 0.1
    TAU: 16

    TEXT_CALIBRATION: True
    LAMBDA_T: 0.5


# Distributional text-to-visual Flow with exemplar-free incremental replay.
FLOW:
  STEPS_PER_EPOCH: 100
  VISUAL_SCALE: 1.0
  MAX_RADIUS: 0.5
  COV_SHRINK: 0.1
  COV_TRANSFER_TEMPERATURE: 16.0
  REPLAY_FRACTION: 0.5
  CYCLE_SCALE: 0.01
  CYCLE_GATE: False  # diagnostic baseline: disable reconstruction gate
  COSINE_TEMPERATURE: 25.0  # shared temperature for cosine branches and Description KNN
  USE_GEOMETRY_PRIORS: True
  NOISE_SCALE: 0.25
  EPOCHS: 100
  BATCH_SIZE: 64
  LR: 0.0002
  WEIGHT_DECAY: 0.0001
  WARMUP_RATIO: 0.05
  MIN_LR_RATIO: 0.01
  BLOCKS: 8
  HIDDEN: 0  # 0 uses CLIP feature dimension
  STEPS: 8
  SOLVER: "euler"  # euler, midpoint, heun, rk4; inference only
  OUTPUT_DIR: "output/gaussian_text_visual_distill_contrast"
  DISTILL_WEIGHT: 1.0
  CONTRAST_WEIGHT: 0.1
  CONTRAST_TEMPERATURE: 20.0
  ADAPT_STEPS: 100
  ALPHA: 1.0  # full reverse image-to-text integration
  BETA_BASE: 0.1
  BETA_INC: 0.5  # validation search: 0.3 to 0.6
  GAMMA: 0.5  # validation search: 0.4 to 0.7
