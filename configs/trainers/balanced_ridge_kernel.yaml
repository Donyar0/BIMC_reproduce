# Stage 2: no SGD; class-anchor kernel flow plus balanced analytic ridge.
METHOD: "balanced_kernel_flow"
SEED: 1
DEVICE:
  DEVICE_NAME: "cuda"
  GPU_ID: "0;"
DATALOADER:
  TRAIN:
    BATCH_SIZE_BASE: 64
    BATCH_SIZE_INC: 64
  TEST:
    BATCH_SIZE: 100
  NUM_WORKERS: 4
MODEL:
  BACKBONE:
    NAME: "ViT-B/16"
TRAINER:
  BiMC:
    PREC: "fp32"
    VISION_CALIBRATION: False
    TEXT_CALIBRATION: True
    LAMBDA_T: 0.5
LORA:
  ENABLED: False
FLOW:
  ADAPT_STEPS: 0
  STEPS: 8
  TTA: False
  TTA_PROTOTYPES: False
  DIAGONAL_WHITEN: False
  OUTPUT_DIR: "output/balanced_ridge_kernel"
GEOMETRY:
  FLOW_TYPE: "kernel"
  KERNEL_BANDWIDTH: 0.4
  KAPPA: 5.0
RIDGE:
  FEATURE_DIM: 8192
  LAMBDA: 10.0
  BATCH_SIZE: 256
  TARGET_MODE: "prototype"
  BLEND_WEIGHT: 0.5
FEATURE:
  MULTILAYER: False
  PATCH_POOLING: False
