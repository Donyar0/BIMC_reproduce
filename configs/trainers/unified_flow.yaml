METHOD: "unified_flow"
SEED: 1

DEVICE:
  DEVICE_NAME: "cuda"
  GPU_ID: "0;"

DATALOADER:
  TRAIN:
    BATCH_SIZE_BASE: 64
    BATCH_SIZE_INC: 64
  TEST:
    BATCH_SIZE: 100
  NUM_WORKERS: 4


MODEL:
  BACKBONE:
    NAME: "ViT-B/16"  #  RN50  RN101  ViT-B/32  ViT-B/16  ViT-L/14
  

TRAINER:
  BiMC:
    PREC: "fp16"  # fp16, fp32, amp

    PROTOTYPE_CACHE_DIR: ""  # e.g. output/bimc_prototypes; export training/support statistics

    VISION_CALIBRATION: True
    LAMBDA_I: 0.1 
    TAU: 16        

    TEXT_CALIBRATION: False
    LAMBDA_T: 0.0

    # calibText: base-supervised Linear Adapter, frozen in incremental sessions.
    VDT_RATIO: 0.2
    VDT_DROPOUT: 0.1
    VDT_EPOCHS: 20
    VDT_BATCH_SIZE: 256
    VDT_LR: 0.0001
    VDT_WEIGHT_DECAY: 0.0001
    VDT_TRAIN_OBJECTIVE: 'text_ce'



# Starting values only; select hyperparameters using base validation data.
FLOW:
  EPOCHS: 100
  BATCH_SIZE: 64
  LR: 0.0002
  WEIGHT_DECAY: 0.0001
  BLOCKS: 24
  HIDDEN: 0  # 0 uses CLIP feature dimension
  TARGET: "sample"
  STEPS: 8
  OUTPUT_DIR: "output/unified_flow"
  ADAPT_STEPS: 100
  ADAPT_LR: 0.0002
  ALPHA: 0.15
  BETA_BASE: 0.1
  BETA_INC: 0.5  # validation search: 0.3 to 0.6
  GAMMA: 0.5  # validation search: 0.4 to 0.7
  LOGIT_SCALE: 1.0  # multiplier before softmax; tune on validation data
