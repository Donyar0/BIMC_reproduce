METHOD: "unified_flow"
SEED: 1

DEVICE:
  DEVICE_NAME: "cuda"
  GPU_ID: "0;"

DATALOADER:
  TRAIN:
    BATCH_SIZE_BASE: 64
    BATCH_SIZE_INC: 64
  TEST:
    BATCH_SIZE: 100
  NUM_WORKERS: 4


MODEL:
  BACKBONE:
    NAME: "ViT-B/16"  #  RN50  RN101  ViT-B/32  ViT-B/16  ViT-L/14
  

TRAINER:
  BiMC:
    PREC: "fp16"  # fp16, fp32, amp

    PROTOTYPE_CACHE_DIR: ""  # e.g. output/bimc_prototypes; export training/support statistics

    VISION_CALIBRATION: True
    LAMBDA_I: 0.1 
    TAU: 16        

    TEXT_CALIBRATION: True
    LAMBDA_T: 0.5

    GAMMA_BASE: 1.0
    GAMMA_INC: 5.0

    USING_ENSEMBLE: True  # enable BiMC covariance/KNN score fusion


# Starting values only; select hyperparameters using base validation data.
FLOW:
  EPOCHS: 100
  BATCH_SIZE: 64
  LR: 0.0002
  WEIGHT_DECAY: 0.0001
  BLOCKS: 24
  HIDDEN: 0  # 0 uses CLIP feature dimension
  TARGET: "sample"
  CE_WEIGHT: 0.0
  CYCLE_WEIGHT: 0.0  # text -> one-step visual -> text regularizer; 0 disables
  TEMPERATURE: 0.07
  STEPS: 8
  OUTPUT_DIR: "output/unified_flow_original_vsc"
  ADAPT_STEPS: 100
  ADAPT_LR: 0.0002
  ALPHA: 0.15
  BETA_BASE: 0.1
  BETA_INC: 0.5  # validation search: 0.3 to 0.6
  GAMMA: 0.5  # validation search: 0.4 to 0.7
  LOGIT_SCALE: 1.0  # multiplier before softmax; tune on validation data
  BASE_MARGIN: 0.0  # subtract from base-class scores in incremental sessions

  # VSC original-direction calibration; set strength 0 for exact baseline.
  # FM, optional CE and query visual->text scoring remain unchanged.
  VSC_VISUAL_STRENGTH: 0.1
  VSC_ATTENTION_TEMPERATURE: 16.0
  VSC_TOPK: 5  # include self; choose up to 4 visually nearest other semantic classes
