# BiMC + CDPS local discriminative patch memory (no optimization).
# Run with --data_cfg configs/datasets/{cifar100,cub200,miniimagenet}.yaml
SEED: 1
DEVICE:
  DEVICE_NAME: "cuda"
  GPU_ID: "0;"
DATALOADER:
  TRAIN:
    BATCH_SIZE_BASE: 64
    BATCH_SIZE_INC: 64
  TEST:
    BATCH_SIZE: 32
  NUM_WORKERS: 4
MODEL:
  BACKBONE:
    NAME: "ViT-B/16"
TRAINER:
  BiMC:
    PREC: "fp16"
    VISION_CALIBRATION: True
    LAMBDA_I: 0.1
    TAU: 16
    TEXT_CALIBRATION: True
    LAMBDA_T: 0.5
    GAMMA_BASE: 1.0
    GAMMA_INC: 5.0
    USING_ENSEMBLE: True
  CDPS:
    ENABLED: True
    GLOBAL_WEIGHT: 0.5   # 1.0=BiMC only; 0.0=patch only
    TOP_PERCENT: 0.4
    NUM_REGIONS: 2
    TOPK: 20
    NUM_CONFUSE: 5
    OMEGA: 0.1
    MAX_SUPPORT: 8       # bounded base-session patch memory / class
    MAX_QUERY_PATCHES: 64
    QUERY_TOPK: 20
    TEMPERATURE: 1.0
    CACHE_DIR: "output/cdps_patch_memory"
